name: Check Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  build:
    uses: ./.github/workflows/build-app.yml
    with:
      NEXT_PUBLIC_SITE_MODE: ${{ vars.NEXT_PUBLIC_SITE_MODE }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_CDN_URL: ${{ vars.NEXT_PUBLIC_CDN_URL }}

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect infrastructure changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            infra:
              - 'terraform/**'
              - 'lambda/**'
              - '.github/workflows/check-pr.yml'

      - name: Setup Terraform
        if: steps.changes.outputs.infra == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Configure AWS credentials
        if: steps.changes.outputs.infra == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Write terraform.tfvars
        if: steps.changes.outputs.infra == 'true'
        run: echo "${{ secrets.TERRAFORM_TFVARS }}" | base64 --decode > "$RUNNER_TEMP/terraform.tfvars"

      - name: Terraform init
        if: steps.changes.outputs.infra == 'true'
        working-directory: terraform
        run: terraform init -input=false -no-color

      - name: Terraform format
        if: steps.changes.outputs.infra == 'true'
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        if: steps.changes.outputs.infra == 'true'
        working-directory: terraform
        run: terraform validate -no-color

      - name: Terraform plan
        if: steps.changes.outputs.infra == 'true'
        working-directory: terraform
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -var-file="$RUNNER_TEMP/terraform.tfvars"
          plan_exit=$?
          set -e
          case "$plan_exit" in
            0) echo "No infrastructure changes." ;;
            2) echo "Infrastructure changes detected." ;;
            *) exit "$plan_exit" ;;
          esac
