name: Check Pull Request

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            js:
              - 'src/**'
              - 'lambda/**'
              - 'scripts/**'
              - '**/*.ts'
              - '**/*.mjs'
              - '**/*.js'
            infra:
              - 'terraform/**'
              - 'lambda/**'
              - '.github/workflows/check-pr.yml'

  lint:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  build:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    uses: ./.github/workflows/build-app.yml
    with:
      NEXT_PUBLIC_SITE_MODE: ${{ vars.NEXT_PUBLIC_SITE_MODE }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_CDN_URL: ${{ vars.NEXT_PUBLIC_CDN_URL }}

  codeql:
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  terraform:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    env:
      TF_VAR_github_pat: ${{ secrets.GH_PAT }}
      TF_VAR_wakatime_api_key: ${{ secrets.WAKATIME_API_KEY }}
      TF_VAR_spotify_client_id: ${{ secrets.SPOTIFY_CLIENT_ID }}
      TF_VAR_spotify_client_secret: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      TF_VAR_spotify_refresh_token: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      TF_VAR_monkeytype_api_key: ${{ secrets.MONKEYTYPE_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false -no-color

      - name: Terraform format
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Terraform validate
        working-directory: terraform
        run: terraform validate -no-color

      - name: Terraform plan
        working-directory: terraform
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode
          plan_exit=$?
          set -e
          case "$plan_exit" in
            0) echo "No infrastructure changes." ;;
            2) echo "Infrastructure changes detected." ;;
            *) exit "$plan_exit" ;;
          esac
