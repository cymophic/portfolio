name: Deploy Infrastructure Changes

on:
  push:
    branches: [main]
    paths: ["terraform/**", "lambda/**", ".github/workflows/deploy-infra.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-infra
  cancel-in-progress: false

env:
  TF_VAR_github_pat: ${{ secrets.GH_PAT }}
  TF_VAR_wakatime_api_key: ${{ secrets.WAKATIME_API_KEY }}
  TF_VAR_spotify_client_id: ${{ secrets.SPOTIFY_CLIENT_ID }}
  TF_VAR_spotify_client_secret: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
  TF_VAR_spotify_refresh_token: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
  TF_VAR_monkeytype_api_key: ${{ secrets.MONKEYTYPE_API_KEY }}
  TF_VAR_gitlab_personal_token: ${{ secrets.GITLAB_PERSONAL_TOKEN }}
  TF_VAR_gitlab_pgx_token: ${{ secrets.GITLAB_PGX_TOKEN }}

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false -no-color

      - name: Terraform plan
        working-directory: terraform
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v7
        with:
          name: terraform-plan
          path: terraform/tfplan
          retention-days: 1

  apply:
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false -no-color

      - name: Download plan artifact
        uses: actions/download-artifact@v8
        with:
          name: terraform-plan
          path: terraform

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -input=false -no-color tfplan
