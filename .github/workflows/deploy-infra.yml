name: Deploy Infrastructure Changes

on:
  push:
    branches: [main]
    paths: ["terraform/**", "lambda/**", ".github/workflows/deploy-infra.yml"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Write terraform.tfvars
        run: echo "${{ secrets.TERRAFORM_TFVARS }}" | base64 --decode > "$RUNNER_TEMP/terraform.tfvars"

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false -no-color

      - name: Terraform plan and apply
        working-directory: terraform
        run: |
          set +e
          terraform plan -input=false -no-color -detailed-exitcode -out=tfplan -var-file="$RUNNER_TEMP/terraform.tfvars"
          plan_exit=$?
          set -e
          if [ "$plan_exit" -eq 1 ]; then
            exit 1
          fi
          if [ "$plan_exit" -eq 2 ]; then
            echo "Infrastructure changes detected - applying."
            terraform apply -input=false -no-color -auto-approve tfplan
          else
            echo "No infrastructure changes - skipping apply."
          fi
