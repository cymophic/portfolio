name: Deploy Infrastructure Changes

on:
  push:
    branches: [main]
    paths: ["terraform/**", "lambda/**", ".github/workflows/deploy-infra.yml"]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TF_VAR_github_pat: ${{ secrets.GH_PAT }}
      TF_VAR_wakatime_api_key: ${{ secrets.WAKATIME_API_KEY }}
      TF_VAR_spotify_client_id: ${{ secrets.SPOTIFY_CLIENT_ID }}
      TF_VAR_spotify_client_secret: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
      TF_VAR_spotify_refresh_token: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
      TF_VAR_monkeytype_api_key: ${{ secrets.MONKEYTYPE_API_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Terraform init
        working-directory: terraform
        run: terraform init -input=false -no-color

      - name: Terraform plan and apply
        working-directory: terraform
        run: |
          terraform plan -input=false -no-color -out=tfplan
          changes=$(terraform show -json tfplan | jq '[.resource_changes[] | select(.change.actions | any(. != "no-op"))] | length')
          if [ "$changes" -gt 0 ]; then
            echo "Infrastructure changes detected ($changes) - applying."
            terraform apply -input=false -no-color -auto-approve tfplan
          else
            echo "No infrastructure changes - skipping apply."
          fi
